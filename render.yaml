# Render Blueprint. Configuration as code, in the repo — deliberately NOT in
# Render's dashboard. Both services build from this one repo with their own
# Dockerfile and their own build filter.
#
# Secrets are marked sync:false: Render prompts for them once and never stores
# them in git.

services:
  - type: web
    name: uc-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    # Free tier: spins down when idle, ~50s cold start on the next request.
    # Fine for two internal users. The worker cannot be free — Render has no
    # free tier for background workers, and a process that polls every 3s is
    # exactly what a free tier is built to prevent.
    plan: free
    healthCheckPath: /
    buildFilter:
      paths:
        - apps/web/**
        - packages/db/**
        - playbooks/registry.yaml
        - package.json
    envVars:
      # The public origin, used to build set-password links. Without this the
      # app can only guess from proxy headers, and request.url gives the
      # container's internal bind address (0.0.0.0:10000) — which produced
      # unreachable links for real users.
      - key: APP_URL
        value: https://nomostra.com
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      # Spend controls (Phase 3.0). The web app refuses to queue past these;
      # the worker holds the authoritative copy. Both read the same names, so
      # a change here needs the same change on the worker below.
      - key: SPEND_CAP_WINDOW_USD
        value: "300"
      - key: SPEND_WINDOW_DAYS
        value: "30"
      - key: GENERATIONS_PER_USER_PER_DAY
        value: "20"
      # NOTE: no ANTHROPIC_API_KEY. The web service never needs it.

  - type: worker
    name: uc-agent
    runtime: docker
    dockerfilePath: ./services/agent/Dockerfile
    dockerContext: .
    plan: starter
    # SUSPENDED BY DEFAULT, and deployed by hand. Not a quirk — this service
    # polls the database, and Neon bills by how long the database is awake, so
    # a worker left running with an empty queue is a pure cost. It burned 88%
    # of a month's compute allowance doing nothing but asking.
    #
    # autoDeploy is off so that pushing to main cannot quietly resume the
    # meter. Render's docs do not say whether a push wakes a suspended
    # service, and the failure mode is expensive enough not to find out.
    # Deploy this one manually when you are about to test.
    autoDeploy: false
    buildFilter:
      paths:
        - services/agent/**
        - playbooks/**
    envVars:
      - key: DATABASE_URL
        sync: false
      # Spend controls (Phase 3.0). This is the authoritative copy: the worker
      # is what spends the money, and it refuses to claim a job past the
      # window cap. Keep in step with the web service above.
      - key: SPEND_CAP_WINDOW_USD
        value: "300"
      - key: SPEND_WINDOW_DAYS
        value: "30"
      - key: SPEND_CAP_PER_GENERATION_USD
        value: "50"
      # Neon bills CU-hours, which is how long the database is AWAKE, not how
      # much is in it. Free plan scale-to-zero needs a 5-minute quiet gap, so
      # anything under 5 min pins the compute at 100% awake and burns ~182
      # CU-hours a month against a 100 CU-hour allowance. Running out suspends
      # the whole project, this repo's web service included.
      #
      # 900s while the queue is normally empty. Drop it to 3 for a testing
      # session, or better, suspend this service when nobody is testing.
      - key: WORKER_POLL_SECONDS
        value: "900"
      # DELIBERATELY UNSET until the spend controls are verified in production.
      # Render will prompt; leave it blank. Setting it is the decision that
      # makes every other line in this file able to cost money.
      - key: ANTHROPIC_API_KEY
        sync: false
