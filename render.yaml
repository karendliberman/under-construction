# Render Blueprint. Configuration as code, in the repo — deliberately NOT in
# Render's dashboard. Both services build from this one repo with their own
# Dockerfile and their own build filter.
#
# Secrets are marked sync:false: Render prompts for them once and never stores
# them in git.

services:
  - type: web
    name: uc-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /
    buildFilter:
      paths:
        - apps/web/**
        - packages/db/**
        - playbooks/registry.yaml
        - package.json
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      # NOTE: no ANTHROPIC_API_KEY. The web service never needs it.

  - type: worker
    name: uc-agent
    runtime: docker
    dockerfilePath: ./services/agent/Dockerfile
    dockerContext: .
    plan: starter
    buildFilter:
      paths:
        - services/agent/**
        - playbooks/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
