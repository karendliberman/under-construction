name: worker

# The worker's image contains all of playbooks/, so any playbook edit rebuilds
# it — and only it.
on:
  push:
    paths:
      - "services/agent/**"
      - "playbooks/**"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "services/agent/**"
      - "playbooks/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./services/agent[dev]"
      - name: Import check
        run: python -c "import agent.loop; print('worker imports cleanly')"
      - name: Tests
        # Guards invariant 6 (resolve_playbook stays deterministic, or
        # generations.playbook_version silently stops meaning anything) and,
        # since Phase 3.0, the spend controls.
        #
        # PLAYBOOKS_DIR is required here and nowhere else. `pip install` (not
        # editable) copies the package into site-packages, so playbooks_dir()'s
        # walk up from __file__ finds no sibling playbooks/ directory. In the
        # repo and in the Docker image the walk works, which is why this only
        # ever broke in CI. The override exists for precisely this case.
        run: python -m pytest services/agent/tests -q
        env:
          PLAYBOOKS_DIR: ${{ github.workspace }}/playbooks
