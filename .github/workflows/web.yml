name: web

# Path-filtered so a playbook edit or a worker change doesn't rebuild the web
# app. registry.yaml is here because the web app does read that one file.
on:
  push:
    paths:
      - "apps/web/**"
      - "packages/db/**"
      - "playbooks/registry.yaml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/db/**"
      - "playbooks/registry.yaml"
      - "package.json"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
