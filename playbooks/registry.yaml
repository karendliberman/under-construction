# The ONLY file in playbooks/ the web service may read (invariant 2).
# Labels and filenames — never prose.
#
# Adding a cause of action is two files and an entry here.
#
# Layer order is fixed in code (playbooks.py), not here: shared guardrails
# frame everything, then the general procedural standard, then the specific
# cause of action, then the jurisdictional gloss last so local practice
# overrides general guidance.

shared:
  - _shared/guardrails.md
  - _shared/house-style.md

causes_of_action:
  breach-of-contract:
    label: "Breach of Contract"
    procedural: procedural/rule-12b6-federal.md
    substantive: causes-of-action/breach-of-contract.md
    jurisdictions: [sdny]

  fraud:
    label: "Fraud"
    procedural: procedural/rule-12b6-federal.md
    substantive: causes-of-action/fraud.md
    jurisdictions: [sdny]

jurisdictions:
  sdny: { label: "S.D.N.Y.", file: jurisdictions/sdny.md }
